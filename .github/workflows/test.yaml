name: Tests

on:
  push:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_FETCH_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_FETCH_GITHUB_APP_PRIVATE_KEY }}
          owner: herdworks

      - name: Configure git to use the App token for GitHub
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com".insteadOf "https://github.com"

      - name: Lint go code
        run: |
          formatted=$(go fmt ./...)
          if [ -n "$formatted" ]; then
            echo "go fmt issues:"
            echo "  $formatted"
            exit 1
          fi

      - name: Run go tests
        run: |
          go test ./... -v

